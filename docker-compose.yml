services:
  frontend:
    image: node:22-alpine
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./ecoride-front-end:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  backend:
    build:
      context: ./docker/php
    working_dir: /var/www/ecoride
    volumes:
      - ./ecoride-back-end:/var/www/ecoride
    environment:
      DATABASE_URL: mysql://ecoride:ecoride_password@mysql:3306/ecoride?serverVersion=8.4.0&charset=utf8mb4
      MONGODB_URL: mongodb://mongodb:27017
    depends_on:
      - mysql
      - mongodb

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./ecoride-back-end:/var/www/ecoride
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecoride
      MYSQL_USER: ecoride
      MYSQL_PASSWORD: ecoride_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mysql_data:
  mongodb_data:
